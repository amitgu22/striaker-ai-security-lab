services:
  demo-ai:
    build: ./demo-app
    container_name: demo-ai
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      AI_SECURITY_MODE: ${AI_SECURITY_MODE:-vulnerable}
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    networks: [ai-security]

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [ai-security]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - demo-ai
    networks: [ai-security]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [ai-security]

  straiker:
    image: straikerai/ascendai-bridge:0.8.0
    container_name: straiker-bridge
    profiles: ["straiker"]
    volumes:
      - ./straiker/config.yaml:/app/config/config.yaml:ro
      - ./straiker/logs:/app/logs
    depends_on:
      - demo-ai
    networks: [ai-security]
    restart: unless-stopped

volumes:
  ollama-data:
  grafana-data:

networks:
  ai-security:
    driver: bridge
